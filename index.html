<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chromatic Detectives</title>
  <meta name="theme-color" content="#ae3efe" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Chromatic Detectives" />
  <meta property="og:description" content="A mystery spanning 14 years. Can you crack the code and restore the spectrum?" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ae3efe",
            "secondary": "#f53fe8",
            "acid": "#ccff00",
            "solar": "#ffb622",
            "cyan-ar": "#00f2ff",
            "background-dark": "#030303",
            "surface-dark": "#151018",
            "neon-pink": "#f53fe8",
            "neon-lime": "#39ff14",
            "neon-cyan": "#00ffff",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"],
            "mono": ["Space Grotesk", "monospace"],
          },
          backgroundImage: {
            'grit-pattern': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
            'rainbow-grit': 'linear-gradient(90deg, #ae3efe 0%, #ff00ff 50%, #00ffff 100%)',
          },
          animation: {
            'spin-slow': 'spin 10s linear infinite',
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shimmer': 'shimmer 2s infinite',
          },
          keyframes: {
            shimmer: {
              '100%': { transform: 'translateX(100%)' },
            }
          }
        },
      },
    }
  </script>
  <style>
    body {
      background-color: #030303;
      color: white;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .glitch-text {
      position: relative;
    }

    .scanline {
      width: 100%;
      height: 2px;
      background: rgba(174, 62, 254, 0.5);
      box-shadow: 0 0 10px rgba(174, 62, 254, 0.8);
      position: absolute;
      z-index: 10;
      pointer-events: none;
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0% {
        top: 0%;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        top: 100%;
        opacity: 0;
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>

</head>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { });
      });

</html>
